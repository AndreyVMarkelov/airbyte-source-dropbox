[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airbyte-source-dropbox-files"
version = "0.1.0"
description = "Airbyte native file-transfer source for Dropbox"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "airbyte-cdk[file-based]==7.25.1",
  "dropbox>=12.0.2,<13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<9.0.0", "ruff>=0.6.0,<1.0.0"]

[project.scripts]
source-dropbox-files = "source_dropbox_files.run:main"

[tool.hatch.build.targets.wheel]
packages = ["source_dropbox_files"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: opt-in tests against a real Dropbox app and test account"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
