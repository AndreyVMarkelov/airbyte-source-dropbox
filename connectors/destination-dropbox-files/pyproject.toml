[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airbyte-destination-dropbox-files"
version = "0.1.0"
description = "Airbyte native file-transfer destination for Dropbox"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["airbyte-cdk==7.25.1", "dropbox>=12.0.2,<13.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<9.0.0", "ruff>=0.6.0,<1.0.0"]

[project.scripts]
destination-dropbox-files = "destination_dropbox_files.run:main"

[tool.hatch.build.targets.wheel]
packages = ["destination_dropbox_files"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B023"]
