name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/source.Dockerfile --tag airbyte/source-dropbox:ci .
      - run: docker run --rm airbyte/source-dropbox:ci spec
      - run: docker build -f docker/destination.Dockerfile --tag airbyte/destination-dropbox:ci .
      - run: docker run --rm airbyte/destination-dropbox:ci spec
