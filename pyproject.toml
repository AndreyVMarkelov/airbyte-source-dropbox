[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airbyte-source-dropbox"
version = "0.1.0"
description = "Airbyte source connector for Dropbox"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Andrey Markelov" }]
dependencies = [
  "airbyte-cdk>=6.0.0,<7.0.0",
  "dropbox>=12.0.2,<13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "ruff>=0.6.0,<1.0.0",
]

[project.scripts]
source-dropbox = "source_dropbox.run:main"

[tool.hatch.build.targets.wheel]
packages = ["source_dropbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
